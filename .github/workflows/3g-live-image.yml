name: 3G live image

# Builds the merged Dockerfile natively on x86_64 GitHub runners (no QEMU) and
# pushes the result to GitHub Container Registry (ghcr.io). Pull it on the
# cluster with:  apptainer build 3g.sif docker://ghcr.io/<owner>/pycbc-3g-live:latest

on:
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [3G-live-testing-branch]
    paths:
      - 'pycbc/**'
      - 'bin/**'
      - 'requirements*.txt'
      - 'companion.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/3g-live-image.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pycbc-3g-live
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
